<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HomeCam</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>HomeCam</h1>
      <p>家用監視器四格快照</p>
    </div>
    <button id="refreshBtn">刷新</button>
  </header>
  <main>
    <section class="grid-card"><img id="grid" alt="四格監視器畫面" src="/api/grid/snapshot" /></section>
    <section id="cameras" class="camera-list"></section>
    <section class="actions"><button id="sendTelegram">傳四格到 Telegram</button><p id="status"></p></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>

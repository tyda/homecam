<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HomeCam</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>HomeCam</h1>
      <p>家用監視器四格快照</p>
    </div>
    <button id="refreshBtn">刷新</button>
  </header>
  <main>
    <section class="cloud-test">
      <h2>手動連線測試</h2>
      <p>每次輸入，不儲存密碼。先測 DVR 是否有 4 路串流。</p>
      <div class="form-grid">
        <label>IP / Host<input id="icatchHost" placeholder="例如 123.123.123.123" autocomplete="off"></label>
        <label>帳號<input id="icatchUser" value="admin" autocomplete="username"></label>
        <label>密碼<input id="icatchPassword" type="password" autocomplete="current-password"></label>
        <label>畫質<select id="icatchQuality"><option value="sub">子碼流</option><option value="main">主碼流</option></select></label>
      </div>
      <div class="player-actions">
        <button id="icatchTest">測試連線</button>
        <button id="nativeLive" class="secondary">原生 4CH 即時播放</button>
        <button id="icatchStop" class="danger">停止</button>
      </div>
      <pre id="icatchResult"></pre>
      <div id="nativeGrid" class="native-grid" aria-label="4CH 即時影像">
        <canvas class="native-canvas" data-channel="1"></canvas>
        <canvas class="native-canvas" data-channel="2"></canvas>
        <canvas class="native-canvas" data-channel="3"></canvas>
        <canvas class="native-canvas" data-channel="4"></canvas>
      </div>
      <canvas id="nativeCanvas" hidden></canvas>
      <img id="icatchPreview" alt="CH1 即時影像" />
    </section>

    <section class="grid-card"><img id="grid" alt="四格監視器畫面" src="/api/grid/snapshot" /></section>
    <section id="cameras" class="camera-list"></section>
    <section class="actions"><button id="sendTelegram">傳四格到 Telegram</button><p id="status"></p></section>
  </main>
  <script src="/icatch-live.js"></script>
  <script src="/app.js"></script>
</body>
</html>
